<div id="add-gallery-item-modal"
     class="exp-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-gallery-item-modal-title">
    <button type="button"
            class="exp-modal__backdrop"
            popovertarget="add-gallery-item-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah item"></button>

    <div class="exp-modal__content">
        <button type="button"
                class="exp-modal__close"
                popovertarget="add-gallery-item-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah item">×</button>

        <h2 id="add-gallery-item-modal-title">Tambah Item About</h2>
        <form id="gallery-item-form"
              method="post"
              action="{% url 'main:create_gallery_item' %}"
              data-ajax-url="{% url 'main:create_gallery_item_ajax' %}"
              enctype="multipart/form-data">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}<small class="form-help">{{ field.help_text }}</small>{% endif %}
                </div>
            {% endfor %}
            <div class="exp-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-gallery-item-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Item</button>
            </div>
        </form>
    </div>
</div>
