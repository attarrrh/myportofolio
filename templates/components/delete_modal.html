<p class="item-status">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-{{ object.id }}"
            aria-label="Hapus {{ object.title }}"
            title="Hapus">
        Hapus
    </button>
</p>
<div id="delete-{{ object.id }}"
     class="delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-modal-title-{{ object.id }}">
    <button type="button"
            class="delete-modal__backdrop"
            popovertarget="delete-{{ object.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="delete-modal__content">
        <button type="button"
                class="delete-modal__close"
                popovertarget="delete-{{ object.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-modal-title-{{ object.id }}">Hapus?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong>{{ object.title }}</strong>?
        </p>
        <div class="delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-{{ object.id }}"
                    popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url delete_url_name object.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
